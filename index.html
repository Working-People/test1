<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoltMart 电子元器件商店</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef5f8;
      --panel: rgba(255, 255, 255, 0.9);
      --ink: #14212d;
      --muted: #607186;
      --line: rgba(124, 151, 176, 0.24);
      --brand: #00a99d;
      --brand-dark: #08766f;
      --accent: #ff9f1c;
      --blue: #246bfe;
      --cyan: #15d9ff;
      --violet: #7c5cff;
      --danger: #dc2626;
      --shadow: 0 18px 42px rgba(18, 35, 56, 0.1);
      --tech-grid:
        linear-gradient(rgba(25, 131, 167, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(25, 131, 167, 0.07) 1px, transparent 1px);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 12%, rgba(21, 217, 255, 0.16), transparent 28%),
        radial-gradient(circle at 92% 6%, rgba(124, 92, 255, 0.14), transparent 26%),
        radial-gradient(circle at 74% 88%, rgba(0, 169, 157, 0.13), transparent 30%),
        var(--tech-grid),
        linear-gradient(180deg, #f8fcff 0%, var(--bg) 42%, #f7fbff 100%);
      background-size: auto, auto, auto, 44px 44px, auto;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(115deg, transparent 0 34%, rgba(21, 217, 255, 0.08) 35%, transparent 42%),
        linear-gradient(72deg, transparent 0 64%, rgba(255, 159, 28, 0.07) 65%, transparent 72%),
        repeating-linear-gradient(0deg, rgba(7, 32, 50, 0.025) 0 1px, transparent 1px 9px);
      mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.72) 58%, transparent 100%);
    }

    button,
    input,
    select {
      font: inherit;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.92), rgba(241, 252, 255, 0.86)),
        linear-gradient(90deg, rgba(21, 217, 255, 0.12), transparent 28%, rgba(124, 92, 255, 0.1));
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 28px rgba(14, 35, 58, 0.06);
    }

    .nav {
      width: min(1180px, calc(100% - 32px));
      min-height: 68px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 220px 1fr auto;
      align-items: center;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 0;
      color: var(--brand-dark);
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background:
        radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.44), transparent 28%),
        linear-gradient(135deg, var(--cyan), var(--brand) 48%, var(--violet));
      box-shadow: 0 8px 22px rgba(21, 217, 255, 0.28), 0 0 0 1px rgba(255, 255, 255, 0.3) inset;
    }

    .search {
      position: relative;
    }

    .search input {
      width: 100%;
      height: 42px;
      padding: 0 14px 0 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      background: rgba(255, 255, 255, 0.84);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8) inset;
    }

    .search svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .cart-pill {
      min-width: 142px;
      height: 42px;
      border: 0;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #fff;
      background: linear-gradient(135deg, var(--brand), #0876d8);
      box-shadow: 0 12px 24px rgba(0, 169, 157, 0.24);
      cursor: pointer;
    }

    .hero {
      position: relative;
      background:
        radial-gradient(circle at 18% 26%, rgba(21, 217, 255, 0.3), transparent 24%),
        radial-gradient(circle at 82% 20%, rgba(124, 92, 255, 0.26), transparent 28%),
        radial-gradient(circle at 62% 82%, rgba(255, 159, 28, 0.14), transparent 24%),
        linear-gradient(135deg, #06121f 0%, #0b2635 46%, #071623 100%);
      color: #fff;
      overflow: hidden;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .hero::before {
      background:
        linear-gradient(rgba(21, 217, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(21, 217, 255, 0.08) 1px, transparent 1px),
        linear-gradient(120deg, transparent 0 22%, rgba(21, 217, 255, 0.16) 23%, transparent 32%),
        linear-gradient(64deg, transparent 0 58%, rgba(124, 92, 255, 0.14) 59%, transparent 69%);
      background-size: 56px 56px, 56px 56px, auto, auto;
      opacity: 0.82;
    }

    .hero::after {
      background:
        radial-gradient(circle at 50% 120%, rgba(21, 217, 255, 0.22), transparent 42%),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 8px);
      mix-blend-mode: screen;
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      min-height: 330px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 520px);
      align-items: center;
      gap: 32px;
      padding: 34px 0;
    }

    .hero h1 {
      margin: 0 0 14px;
      font-size: clamp(38px, 6vw, 72px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .hero p {
      max-width: 560px;
      margin: 0 0 24px;
      color: #c9d8dd;
      font-size: 17px;
      line-height: 1.7;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .primary,
    .secondary {
      height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .primary {
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #ff6b35);
      box-shadow: 0 12px 28px rgba(255, 159, 28, 0.28);
    }

    .secondary {
      color: #e7f1f3;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(21, 217, 255, 0.28);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
    }

    .bench-photo {
      min-height: 260px;
      border-radius: 8px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.03)),
        radial-gradient(circle at 18% 24%, rgba(21, 217, 255, 0.34), transparent 20%),
        radial-gradient(circle at 78% 18%, rgba(255, 159, 28, 0.34), transparent 18%),
        linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        #102c3b;
      background-size: auto, auto, auto, 28px 28px, 28px 28px, auto;
      position: relative;
      box-shadow:
        inset 0 0 0 1px rgba(21, 217, 255, 0.22),
        inset 0 0 48px rgba(21, 217, 255, 0.08),
        0 24px 60px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    .bench-photo::before,
    .bench-photo::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .bench-photo::before {
      inset: 0;
      background:
        linear-gradient(105deg, transparent 0 38%, rgba(21, 217, 255, 0.28) 39%, transparent 47%),
        repeating-linear-gradient(90deg, transparent 0 34px, rgba(255, 255, 255, 0.06) 34px 35px);
      opacity: 0.72;
    }

    .bench-photo::after {
      left: -16%;
      right: -16%;
      top: 58%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(21, 217, 255, 0.85), rgba(255, 159, 28, 0.72), transparent);
      box-shadow: 0 0 24px rgba(21, 217, 255, 0.5);
      transform: rotate(-5deg);
    }

    .pcb {
      position: absolute;
      inset: 38px 44px 52px;
      border-radius: 8px;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.14), transparent 18%),
        linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
        linear-gradient(135deg, #08a884, #066f72);
      background-size: auto, 24px 24px, 24px 24px, auto;
      transform: rotate(-5deg);
      box-shadow: 0 20px 34px rgba(0, 0, 0, 0.2), 0 0 36px rgba(21, 217, 255, 0.16);
    }

    .trace {
      position: absolute;
      height: 4px;
      background: rgba(238, 246, 239, 0.72);
      border-radius: 999px;
    }

    .trace:nth-child(1) { left: 36px; top: 44px; width: 230px; }
    .trace:nth-child(2) { left: 80px; top: 94px; width: 310px; }
    .trace:nth-child(3) { left: 42px; top: 146px; width: 210px; }
    .trace:nth-child(4) { right: 38px; top: 52px; width: 4px; height: 120px; }

    .chip {
      position: absolute;
      left: 38%;
      top: 34%;
      width: 106px;
      height: 76px;
      border-radius: 6px;
      background: #202b37;
      box-shadow: 0 0 0 8px rgba(17, 24, 39, 0.25);
    }

    .chip::before,
    .chip::after {
      content: "";
      position: absolute;
      left: -22px;
      right: -22px;
      top: 12px;
      bottom: 12px;
      background: repeating-linear-gradient(90deg, #d6e2e1 0 6px, transparent 6px 14px);
      z-index: -1;
    }

    .led {
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 24px #f59e0b;
    }

    .led.one { left: 78px; bottom: 48px; }
    .led.two { right: 84px; top: 54px; background: #60a5fa; box-shadow: 0 0 24px #60a5fa; }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 28px auto 42px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .stat strong {
      display: block;
      font-size: 24px;
      margin-bottom: 4px;
    }

    .stat span {
      color: var(--muted);
      font-size: 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 22px;
      align-items: start;
    }

    .filters,
    .summary {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .filters {
      position: sticky;
      top: 88px;
      padding: 16px;
    }

    .filters h2,
    .summary h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .filter-group {
      padding: 15px 0;
      border-top: 1px solid var(--line);
    }

    .filter-group:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .filter-group label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 10px 0;
      color: #374151;
      cursor: pointer;
    }

    .filter-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--brand);
    }

    .sort-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .sort-row h2 {
      margin: 0;
      font-size: 22px;
    }

    select {
      height: 38px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.88);
      color: var(--ink);
    }

    .products {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .product {
      min-height: 392px;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .product-art {
      height: 150px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 24% 28%, rgba(21, 217, 255, 0.22), transparent 26%),
        radial-gradient(circle at 82% 18%, rgba(255, 159, 28, 0.18), transparent 24%),
        linear-gradient(rgba(36, 107, 254, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(36, 107, 254, 0.08) 1px, transparent 1px),
        linear-gradient(140deg, #ecfeff, #f8fafc 54%, #fff7ed);
      background-size: auto, auto, 24px 24px, 24px 24px, auto;
      border-bottom: 1px solid var(--line);
    }

    .component-svg {
      width: 150px;
      height: 110px;
    }

    .product-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .tag {
      padding: 4px 8px;
      border-radius: 999px;
      color: var(--brand-dark);
      background: linear-gradient(135deg, #ccfbf1, #dff7ff);
      white-space: nowrap;
    }

    .product h3 {
      margin: 0 0 8px;
      font-size: 17px;
      line-height: 1.35;
    }

    .desc {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .specs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      margin: auto 0 14px;
      font-size: 13px;
      color: #475569;
    }

    .specs span {
      min-height: 30px;
      padding: 7px 8px;
      border-radius: 6px;
      background:
        linear-gradient(135deg, rgba(21, 217, 255, 0.11), rgba(124, 92, 255, 0.06)),
        #f1f5f9;
      overflow-wrap: anywhere;
    }

    .buy-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .price {
      font-size: 22px;
      font-weight: 800;
      color: var(--ink);
    }

    .stock {
      font-size: 12px;
      color: var(--brand-dark);
    }

    .add {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(135deg, var(--blue), var(--violet));
      box-shadow: 0 10px 20px rgba(36, 107, 254, 0.24);
      cursor: pointer;
    }

    .summary {
      margin-top: 22px;
      padding: 18px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 14px;
    }

    .summary p {
      margin: 0;
      color: var(--muted);
    }

    .summary strong {
      font-size: 22px;
    }

    .empty {
      grid-column: 1 / -1;
      min-height: 180px;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.86);
      border: 1px dashed var(--line);
      border-radius: 8px;
    }

    @media (max-width: 980px) {
      .nav {
        grid-template-columns: 1fr auto;
      }

      .search {
        grid-column: 1 / -1;
        grid-row: 2;
        margin-bottom: 12px;
      }

      .hero-inner,
      .layout {
        grid-template-columns: 1fr;
      }

      .filters {
        position: static;
      }

      .filter-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 18px;
      }

      .products,
      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .nav {
        width: min(100% - 22px, 1180px);
        grid-template-columns: 1fr;
        padding-top: 10px;
      }

      .cart-pill {
        width: 100%;
      }

      .hero-inner,
      main {
        width: min(100% - 22px, 1180px);
      }

      .hero-inner {
        min-height: auto;
        padding: 28px 0;
      }

      .bench-photo {
        min-height: 210px;
      }

      .pcb {
        inset: 34px 28px 40px;
      }

      .stats,
      .products,
      .filter-grid,
      .summary {
        grid-template-columns: 1fr;
      }

      .sort-row {
        align-items: stretch;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="nav" aria-label="主导航">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M13 2 4 14h7l-1 8 10-13h-7l0-7Z" fill="currentColor"/>
          </svg>
        </span>
        <span>VoltMart 元器件</span>
      </div>

      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m21 21-4.35-4.35M10.8 18a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="search" placeholder="搜索芯片、传感器、电容、电阻..." autocomplete="off">
      </label>

      <button class="cart-pill" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 6h15l-2 8H8L6 3H3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2ZM18 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" fill="currentColor"/>
        </svg>
        <span id="cartCount">购物车 0</span>
      </button>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <div>
        <h1>VoltMart 电子元器件商店</h1>
        <p>面向工程师、创客和维修工作室的一站式采购页：常用芯片、模块、传感器、被动元件现货展示，按项目快速选型。</p>
        <div class="hero-actions">
          <button class="primary" type="button" onclick="document.getElementById('catalog').scrollIntoView({behavior: 'smooth'})">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            浏览目录
          </button>
          <button class="secondary" type="button" onclick="setQuickFilter('开发板')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M7 7h10v10H7zM4 10h3M4 14h3M17 10h3M17 14h3M10 4v3M14 4v3M10 17v3M14 17v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            看开发板
          </button>
        </div>
      </div>
      <div class="bench-photo" aria-label="电子实验台和电路板插画">
        <div class="pcb">
          <span class="trace"></span>
          <span class="trace"></span>
          <span class="trace"></span>
          <span class="trace"></span>
          <span class="chip"></span>
          <span class="led one"></span>
          <span class="led two"></span>
        </div>
      </div>
    </div>
  </section>

  <main id="catalog">
    <section class="stats" aria-label="商店数据">
      <div class="stat"><strong>3,200+</strong><span>常备 SKU</span></div>
      <div class="stat"><strong>24h</strong><span>工作日快速出库</span></div>
      <div class="stat"><strong>98%</strong><span>商品批次可追溯</span></div>
      <div class="stat"><strong>¥49</strong><span>起免基础运费</span></div>
    </section>

    <div class="layout">
      <aside class="filters" aria-label="筛选器">
        <h2>筛选</h2>
        <div class="filter-group">
          <strong>分类</strong>
          <div class="filter-grid" id="categoryFilters"></div>
        </div>
        <div class="filter-group">
          <strong>库存</strong>
          <label>仅看现货 <input id="stockOnly" type="checkbox"></label>
          <label>适合样机 <input id="protoOnly" type="checkbox"></label>
        </div>
      </aside>

      <section>
        <div class="sort-row">
          <h2>精选元器件 <span id="resultCount"></span></h2>
          <select id="sortSelect" aria-label="排序">
            <option value="popular">按热度排序</option>
            <option value="priceAsc">价格从低到高</option>
            <option value="priceDesc">价格从高到低</option>
            <option value="stockDesc">库存优先</option>
          </select>
        </div>
        <div class="products" id="productGrid"></div>
      </section>
    </div>

    <section class="summary" aria-label="购物车摘要">
      <div>
        <h2>采购清单</h2>
        <p id="cartText">还没有添加商品。可先按项目加入样品，再统一核对规格。</p>
      </div>
      <strong id="cartTotal">¥0.00</strong>
      <button class="primary" type="button">提交询价</button>
    </section>
  </main>

  <script>
    const products = [
      {
        name: "ESP32-WROOM-32E 无线模块",
        category: "无线模块",
        price: 18.9,
        stock: 1280,
        hot: 98,
        proto: true,
        desc: "双核 MCU，支持 Wi-Fi 与蓝牙，适合物联网网关和传感节点。",
        specs: ["3.3V", "240MHz", "PCB 天线", "16MB Flash"],
        art: "module"
      },
      {
        name: "STM32F103C8T6 开发板",
        category: "开发板",
        price: 22.5,
        stock: 640,
        hot: 91,
        proto: true,
        desc: "经典 ARM Cortex-M3 最小系统板，适合教学、验证和嵌入式项目。",
        specs: ["72MHz", "64KB Flash", "Micro USB", "GPIO x37"],
        art: "board"
      },
      {
        name: "BME280 温湿压传感器",
        category: "传感器",
        price: 12.8,
        stock: 384,
        hot: 87,
        proto: true,
        desc: "I2C/SPI 数字传感器，适合环境监测、气象站和低功耗设备。",
        specs: ["I2C/SPI", "1.8-3.6V", "湿度 ±3%", "压力 ±1hPa"],
        art: "sensor"
      },
      {
        name: "AMS1117-3.3 稳压芯片",
        category: "电源管理",
        price: 0.38,
        stock: 8200,
        hot: 76,
        proto: false,
        desc: "常用 LDO 线性稳压器，适合小电流 3.3V 供电设计。",
        specs: ["SOT-223", "3.3V", "1A Max", "低噪声"],
        art: "chip"
      },
      {
        name: "0603 10K 精密电阻包",
        category: "被动元件",
        price: 3.2,
        stock: 12000,
        hot: 74,
        proto: false,
        desc: "1% 精度贴片电阻，批量维修、打样和实验室备料都很顺手。",
        specs: ["0603", "10KΩ", "1%", "100pcs"],
        art: "resistor"
      },
      {
        name: "100uF 25V 低 ESR 电解电容",
        category: "被动元件",
        price: 0.72,
        stock: 5300,
        hot: 68,
        proto: false,
        desc: "电源滤波和纹波抑制常用规格，适合 DC-DC 输出端。",
        specs: ["100uF", "25V", "低 ESR", "105°C"],
        art: "capacitor"
      },
      {
        name: "TB6612FNG 双路电机驱动",
        category: "驱动芯片",
        price: 8.6,
        stock: 312,
        hot: 82,
        proto: true,
        desc: "双 H 桥驱动模块，可控制两路直流电机或一路步进电机。",
        specs: ["1.2A", "2.7-10.8V", "PWM", "小车常用"],
        art: "driver"
      },
      {
        name: "5mm 高亮 LED 混色套装",
        category: "光电器件",
        price: 6.9,
        stock: 2300,
        hot: 64,
        proto: true,
        desc: "红绿蓝黄白五色组合，适合指示灯、实验课和快速打样。",
        specs: ["5 色", "100pcs", "直插", "高亮"],
        art: "led"
      },
      {
        name: "USB-C 16Pin 母座",
        category: "连接器",
        price: 1.15,
        stock: 1750,
        hot: 79,
        proto: false,
        desc: "沉板式 Type-C 接口，适用于充电、供电和轻量数据连接。",
        specs: ["16Pin", "SMT", "耐插拔", "沉板"],
        art: "connector"
      }
    ];

    const grid = document.getElementById("productGrid");
    const categoryFilters = document.getElementById("categoryFilters");
    const searchInput = document.getElementById("searchInput");
    const stockOnly = document.getElementById("stockOnly");
    const protoOnly = document.getElementById("protoOnly");
    const sortSelect = document.getElementById("sortSelect");
    const resultCount = document.getElementById("resultCount");
    const cartCount = document.getElementById("cartCount");
    const cartText = document.getElementById("cartText");
    const cartTotal = document.getElementById("cartTotal");
    const cart = [];

    const categories = [...new Set(products.map(product => product.category))];

    function icon(type) {
      const common = 'class="component-svg" viewBox="0 0 160 120" fill="none" aria-hidden="true"';
      const icons = {
        module: `<svg ${common}><rect x="28" y="24" width="104" height="72" rx="8" fill="#0f766e"/><rect x="42" y="38" width="44" height="32" rx="4" fill="#17202c"/><path d="M98 42h20M98 56h20M98 70h20" stroke="#ccfbf1" stroke-width="4" stroke-linecap="round"/><path d="M38 102h84" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/></svg>`,
        board: `<svg ${common}><rect x="22" y="22" width="116" height="76" rx="10" fill="#16a34a"/><rect x="50" y="42" width="46" height="30" rx="5" fill="#111827"/><circle cx="38" cy="38" r="6" fill="#bbf7d0"/><circle cx="122" cy="82" r="6" fill="#bbf7d0"/><path d="M28 104h104" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/></svg>`,
        sensor: `<svg ${common}><rect x="42" y="28" width="76" height="64" rx="8" fill="#2563eb"/><circle cx="80" cy="60" r="20" fill="#dbeafe"/><circle cx="80" cy="60" r="8" fill="#2563eb"/><path d="M52 102h56" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/></svg>`,
        chip: `<svg ${common}><rect x="48" y="34" width="64" height="52" rx="6" fill="#1f2937"/><path d="M34 42h14M34 56h14M34 70h14M112 42h14M112 56h14M112 70h14" stroke="#64748b" stroke-width="6" stroke-linecap="round"/><path d="M66 58h28" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/></svg>`,
        resistor: `<svg ${common}><path d="M24 62h32M104 62h32" stroke="#64748b" stroke-width="6" stroke-linecap="round"/><rect x="56" y="44" width="48" height="36" rx="18" fill="#f59e0b"/><path d="M68 45v34M80 45v34M92 45v34" stroke="#7c2d12" stroke-width="5"/></svg>`,
        capacitor: `<svg ${common}><path d="M56 96V30M104 96V30" stroke="#64748b" stroke-width="7" stroke-linecap="round"/><rect x="46" y="20" width="68" height="74" rx="14" fill="#334155"/><path d="M58 34h18M58 48h18" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/></svg>`,
        driver: `<svg ${common}><rect x="36" y="30" width="88" height="58" rx="8" fill="#7c3aed"/><rect x="58" y="44" width="44" height="30" rx="5" fill="#111827"/><path d="M30 100h100M44 24v12M116 24v12" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/></svg>`,
        led: `<svg ${common}><path d="M80 78v24M62 98h36" stroke="#64748b" stroke-width="7" stroke-linecap="round"/><path d="M52 58a28 28 0 1 1 56 0v16H52V58Z" fill="#facc15"/><path d="M62 44c8-10 23-12 34-2" stroke="#fff7ed" stroke-width="5" stroke-linecap="round"/></svg>`,
        connector: `<svg ${common}><rect x="38" y="42" width="84" height="36" rx="10" fill="#475569"/><rect x="54" y="52" width="52" height="16" rx="8" fill="#e2e8f0"/><path d="M46 86h68" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/></svg>`
      };
      return icons[type] || icons.chip;
    }

    function renderCategories() {
      categoryFilters.innerHTML = categories.map(category => `
        <label>
          ${category}
          <input type="checkbox" name="category" value="${category}">
        </label>
      `).join("");
      categoryFilters.querySelectorAll("input").forEach(input => input.addEventListener("change", renderProducts));
    }

    function getFilteredProducts() {
      const query = searchInput.value.trim().toLowerCase();
      const checked = [...categoryFilters.querySelectorAll("input:checked")].map(input => input.value);
      let list = products.filter(product => {
        const text = `${product.name} ${product.category} ${product.desc} ${product.specs.join(" ")}`.toLowerCase();
        const matchQuery = !query || text.includes(query);
        const matchCategory = checked.length === 0 || checked.includes(product.category);
        const matchStock = !stockOnly.checked || product.stock > 0;
        const matchProto = !protoOnly.checked || product.proto;
        return matchQuery && matchCategory && matchStock && matchProto;
      });

      const sorters = {
        popular: (a, b) => b.hot - a.hot,
        priceAsc: (a, b) => a.price - b.price,
        priceDesc: (a, b) => b.price - a.price,
        stockDesc: (a, b) => b.stock - a.stock
      };
      return list.sort(sorters[sortSelect.value]);
    }

    function renderProducts() {
      const list = getFilteredProducts();
      resultCount.textContent = `(${list.length})`;
      if (!list.length) {
        grid.innerHTML = '<div class="empty">没有找到匹配的元器件，试试放宽筛选条件。</div>';
        return;
      }
      grid.innerHTML = list.map((product, index) => `
        <article class="product">
          <div class="product-art">${icon(product.art)}</div>
          <div class="product-body">
            <div class="meta">
              <span class="tag">${product.category}</span>
              <span>库存 ${product.stock.toLocaleString("zh-CN")} 件</span>
            </div>
            <h3>${product.name}</h3>
            <p class="desc">${product.desc}</p>
            <div class="specs">
              ${product.specs.map(spec => `<span>${spec}</span>`).join("")}
            </div>
            <div class="buy-row">
              <div>
                <div class="price">¥${product.price.toFixed(2)}</div>
                <div class="stock">${product.proto ? "样机友好" : "批量备料"}</div>
              </div>
              <button class="add" type="button" aria-label="加入 ${product.name}" onclick="addToCart(${products.indexOf(product)})">
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
          </div>
        </article>
      `).join("");
    }

    function addToCart(index) {
      cart.push(products[index]);
      const total = cart.reduce((sum, product) => sum + product.price, 0);
      cartCount.textContent = `购物车 ${cart.length}`;
      cartText.textContent = `已加入 ${cart.length} 件商品：${cart.slice(-3).map(product => product.name).join("、")}`;
      cartTotal.textContent = `¥${total.toFixed(2)}`;
    }

    function setQuickFilter(category) {
      categoryFilters.querySelectorAll("input").forEach(input => {
        input.checked = input.value === category;
      });
      renderProducts();
      document.getElementById("catalog").scrollIntoView({ behavior: "smooth" });
    }

    [searchInput, stockOnly, protoOnly, sortSelect].forEach(control => {
      control.addEventListener("input", renderProducts);
      control.addEventListener("change", renderProducts);
    });

    renderCategories();
    renderProducts();
  </script>
</body>
</html>
